# Render Blueprint — deploys ShadowPool as a SINGLE service.
#
# The node serves both the API (/api/*) and the statically-exported frontend
# (everything else) from one origin, so there is no second service, no
# cross-service URL to configure, and no CORS.
#
# In Render: New → Blueprint → connect the repo → it reads this file and
# prompts for the secrets below. Full walkthrough: DEPLOY.md
#
# Plain npm only — Render's image is read-only, so corepack/pnpm cannot be
# installed, and the start command runs the installed binary directly.

services:
  - type: web
    name: shadowpool
    runtime: node
    plan: starter # free instances sleep after 15 min idle — see DEPLOY.md
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/enclave
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RPC_URL
        value: https://coston2-api.flare.network/ext/C/rpc
      - key: DEPLOYMENT_FILE
        value: ../contracts/deployments/114.json
      # --- secrets: Render prompts for these ---
      # Funded Coston2 key that pays gas for settlement transactions.
      - key: RELAY_KEY
        sync: false
      # Enclave identity. MUST stay constant across deploys: the filesystem is
      # ephemeral, so a regenerated key would no longer match the on-chain
      # teeSigner and every settlement would revert with InvalidAttestation.
      - key: ENCLAVE_BOX_SECRET
        sync: false
      - key: ENCLAVE_SIGNER_KEY
        sync: false
