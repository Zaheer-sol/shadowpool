# Render Blueprint — deploys both ShadowPool services.
#
# In Render: New → Blueprint → connect the repo → it reads this file.
# Then fill in the env vars marked `sync: false` when prompted.
# Full walkthrough, including how to obtain the enclave keys: DEPLOY.md
#
# Everything here uses plain npm on purpose. Earlier revisions used pnpm via
# corepack, which fails on Render with `EROFS: read-only file system,
# unlink '/usr/bin/pnpm'`. Start commands invoke the installed binaries
# directly so no package manager is needed at runtime.

services:
  # ---------------------------------------------------------------------------
  # The off-chain node: matching enclave + chain relay + public read-only API.
  # ---------------------------------------------------------------------------
  - type: web
    name: shadowpool-node
    runtime: node
    plan: starter # free instances sleep after 15 min idle — see DEPLOY.md
    rootDir: services
    # rm -rf node_modules first: Render restores a build cache between deploys,
    # and a node_modules left behind by a different package manager makes npm
    # fail with "Cannot read properties of null (reading 'matches')".
    buildCommand: rm -rf node_modules package-lock.json && npm install --no-audit --no-fund
    startCommand: node_modules/.bin/tsx src/index.ts
    healthCheckPath: /api/enclave
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RPC_URL
        value: https://coston2-api.flare.network/ext/C/rpc
      - key: DEPLOYMENT_FILE
        value: ../contracts/deployments/114.json
      # --- secrets: Render prompts for these ---
      # Funded Coston2 key that pays gas for settlement transactions.
      - key: RELAY_KEY
        sync: false
      # Enclave identity. MUST stay constant across deploys: the filesystem is
      # ephemeral, so a regenerated key would no longer match the on-chain
      # teeSigner and every settlement would revert with InvalidAttestation.
      - key: ENCLAVE_BOX_SECRET
        sync: false
      - key: ENCLAVE_SIGNER_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # The Next.js frontend.
  # ---------------------------------------------------------------------------
  - type: web
    name: shadowpool-web
    runtime: node
    plan: starter
    rootDir: web
    buildCommand: rm -rf node_modules package-lock.json .next && npm install --no-audit --no-fund && npm run build
    startCommand: node_modules/.bin/next start --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set to the node's public URL, e.g. https://shadowpool-node.onrender.com
      # NEXT_PUBLIC_* is baked in at BUILD time, so changing it requires a
      # manual redeploy of this service — a restart will not pick it up.
      - key: NEXT_PUBLIC_API_URL
        sync: false
